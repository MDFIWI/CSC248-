name: Notifier

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  messageSlack:
    runs-on: ubuntu-24.04
    steps:
    - name: Notification Slack
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_CHANNEL: ci
        SLACK_TITLE: Post Title
        SLACK_USERNAME: BotCI
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_MESSAGE: "This is your custom message."

    # 2. TELEGRAM NOTIFICATION
    - name: Notification Telegram
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        # Enables markdown styling so you can click the commit hashes and links
                format: markdown
                message: |
                  *New Commit Pushed!* 🚀

                  *Repository:* `${{ github.repository }}`
                  *Branch:* `${{ github.ref_name }}`
                  *Author:* ${{ github.actor }}

                  *Commit Message:*
                  > ${{ github.event.head_commit.message }}

                  [View Commit Changes](${{ github.event.head_commit.url }})
